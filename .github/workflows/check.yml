name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: docs / version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 0.1.4/0.1.5 曾把改动留在 [Unreleased] 就发布，README 徽章也停在旧版本。
      # 这个 job 专门拦住这类「代码发了、文档没发」的漂移。
      - run: node scripts/check-docs.mjs

  syntax:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  package:
    name: npm package sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm pack --dry-run 不联网、不装依赖，验证 files 白名单与包结构
      - run: npm pack --dry-run --json > /tmp/pack.json
      - name: assert expected files are packaged
        run: |
          node -e "
            const p = require('/tmp/pack.json')[0];
            const want = [
              'lib/index.mjs','lib/client.js','scripts/check-compat.mjs','scripts/check-docs.mjs',
              'cordis.patch.yml','CHANGELOG.md','README.md','README.zh-CN.md','LICENSE','package.json'
            ];
            const have = p.files.map(f => f.path);
            const missing = want.filter(w => !have.includes(w));
            if (missing.length) { console.error('missing in tarball:', missing); process.exit(1); }
            console.log('tarball ok,', have.length, 'files');
          "
      - name: warn if version already published (only meaningful before publish)
        run: |
          node -e "
            const cur = require('./package.json').version;
            const https = require('https');
            https.get('https://registry.npmjs.org/dsh-plugin-thinking-api', r => {
              let b=''; r.on('data', c => b += c); r.on('end', () => {
                const latest = JSON.parse(b)['dist-tags'].latest;
                if (cur === latest) { console.log('version ' + cur + ' == npm latest; bump before publish (not a CI failure)'); }
                else { console.log('version ' + cur + ' != latest ' + latest); }
              });
            }).on('error', () => { console.log('registry unreachable — skip'); });
          "
